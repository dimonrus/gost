<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="favicon.png"/>
    <title>Go Visual Architect</title>
</head>
<body>
<div class="toolbar">
    <div class="title">🔷 Go Visual Architect</div>
    <button onclick="addBlock('interface')">➕ Interface</button>
    <button onclick="addBlock('struct')">➕ Struct</button>
    <button onclick="addBlock('method')">➕ Function</button>
    <div class="separator"></div>
    <button onclick="exportProject()">📤 Export Go</button>
    <button onclick="importProject()">📥 Import Go</button>
    <div class="separator"></div>
    <div class="zoom-controls">
        <button onclick="zoomOut()" title="Zoom Out (Ctrl+-)">−</button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button onclick="zoomIn()" title="Zoom In (Ctrl++)">+</button>
        <button onclick="resetZoom()" title="Reset (Ctrl+0)">⟲</button>
    </div>
    <div class="separator"></div>
    <button onclick="undo()" id="undoBtn" title="Undo (Ctrl+Z)">↩️ Undo</button>
    <button onclick="redo()" id="redoBtn" title="Redo (Ctrl+Y)">↪️ Redo</button>
    <div class="separator"></div>
    <button onclick="clearCanvas()">🗑️ Clear</button>
</div>

<div class="canvas-container" id="canvasContainer">
    <div id="canvas">
        <div class="empty-state" id="emptyState">
            <h2>Welcome to Go Visual Architect</h2>
            <p>Add blocks using the toolbar above</p>
            <p style="margin-top: 8px; font-size: 12px;">Click a block to select it, then press Ctrl+D to duplicate</p>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3 id="modalTitle">Export Go Code</h3>
        <textarea id="modalTextarea" placeholder="// Go code will appear here..."></textarea>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeModal()">Close</button>
            <button class="btn-primary" id="modalActionBtn" onclick="modalAction()">Copy</button>
        </div>
    </div>
</div>
<div class="tooltip" id="tooltip"></div>
<script src="render.js"></script>
</body>
</html>
